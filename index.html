  function chooseCloze(lesson){

  }

  function commonCorrections(text){
    const rules=[
      [/\bi am agree\b/ig,'I agree'],[/\bi have (\d+) years(?: old)?\b/ig,'I am $1 years old'],[/\bpeople is\b/ig,'people are'],[/\bmore better\b/ig,'better'],[/\binformations\b/ig,'information'],[/\badvices\b/ig,'advice'],[/\bdepend of\b/ig,'depend on'],[/\bi make deliveries yesterday\b/ig,'I made deliveries yesterday'],[/\bi work yesterday\b/ig,'I worked yesterday'],[/\bshe work\b/ig,'she works'],[/\bhe work\b/ig,'he works'],[/\bi no understand\b/ig,"I don't understand"],[/\bcan you repeat again\b/ig,'Can you repeat that?']

  }

  async function askLia(message,scenario,currentPrompt,nextPrompt){

      const res=await fetch('/api/lia',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:String(message||'').slice(0,1200),level:state.level,scenario:scenario?.title||'Everyday English',goal:scenario?.goal||'Communicate clearly',currentPrompt:currentPrompt||'',nextPrompt:nextPrompt||'',history}),signal:ctrl.signal});

  function writingAnalysis(text,prompt){
    const t=text.trim(),w=words(t),sent=(t.match(/[.!?]+/g)||[]).length|| (t?1:0);const issues=[];let score=55;
    if(w.length>=8)score+=8;else issues.push('Expanda a resposta: produza pelo menos uma ideia completa.');
    if(sent>=2)score+=6;
    if(t&&/^[A-Z]/.test(t))score+=4;else issues.push('Comece a frase com letra maiúscula.');
    if(/[.!?]$/.test(t))score+=4;else issues.push('Finalize a última frase com pontuação.');
    const rules=[[/\bi am agree\b/i,'Use “I agree”, não “I am agree”.'],[/\bi have \d+ years/i,'Para idade, use “I am ... years old”.'],[/\bpeople is\b/i,'“People” normalmente pede “are”.'],[/\bmore better\b/i,'Use apenas “better”.'],[/\binformations\b/i,'“Information” é incontável.'],[/\badvices\b/i,'“Advice” é incontável.'],[/\bdepend of\b/i,'Use “depend on”.'],[/\bi\b/g,'O pronome “I” deve ser maiúsculo.']];
    for(const [re,msg] of rules){if(re.test(t)){issues.push(msg);score-=7;}}
    const ptHits=(normalize(t).match(/\b(eu|que|para|com|uma|um|meu|minha|trabalho|porque)\b/g)||[]).length;if(ptHits>=2){issues.push('Há palavras em português; tente manter a produção em inglês.');score-=10;}
    const modelWords=new Set(words(prompt.model).filter(x=>x.length>3));const overlap=w.filter(x=>modelWords.has(x)).length;if(overlap>=2)score+=6;
    score=clamp(score,20,95);return {score,issues,wc:w.length,sent};
  }

  function speak(text){

  function recognition(onResult,onEnd,onInterim){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Reconhecimento de voz não disponível aqui. Use Chrome/Edge e permita o microfone.');setLiaMood('coach','Microfone indisponível — podemos continuar por texto');onEnd?.();return null;}

    r.onerror=()=>{toast('Não consegui ouvir com clareza. Tente novamente.');setLiaMood('coach','Não ouvi com clareza. Tente de novo');onEnd?.();};

    const scen=e.target.closest('[data-scenario]');if(scen){state.scenario=scen.dataset.scenario;state.chatTurn=0;save();renderTalk();return;}

    const pa=e.target.closest('[data-placement-answer]');if(pa){const i=Number(pa.dataset.placementI),q=DATA.placement[i],ok=Number(pa.dataset.placementAnswer)===q.a;if(!placementSession)runPlacement(0);placementSession.correct+=ok?1:0;placementSession.byLevel[q.level].total+=1;placementSession.byLevel[q.level].correct+=ok?1:0;i<DATA.placement.length-1?runPlacement(i+1):finishPlacement();return;}
    const start=e.target.closest('[data-start-level]');if(start){state.level=start.dataset.startLevel;state.startLevel=start.dataset.startLevel;state.onboarded=true;save();closeModal();renderHome();return;}
    const la=e.target.closest('[data-lesson-answer]');if(la){const {activities}=currentActivity(),act=activities[state.lessonStep],given=decodeURIComponent(la.dataset.lessonAnswer),g=gradeActivity(act,given);$$('[data-lesson-answer]').forEach(b=>b.disabled=true);la.classList.add(g.ok?'correct':'wrong');if(!g.ok)$$('[data-lesson-answer]').find(b=>normalize(decodeURIComponent(b.dataset.lessonAnswer))===normalize(act.answer))?.classList.add('correct');showLessonFeedback(g.ok,act.answer);return;}
    const lis=e.target.closest('[data-listen-answer]');if(lis){const given=decodeURIComponent(lis.dataset.listenAnswer),correct=decodeURIComponent(lis.dataset.listenCorrect),ok=normalize(given)===normalize(correct);$$('[data-listen-answer]').forEach(b=>b.disabled=true);lis.classList.add(ok?'correct':'wrong');if(!ok)$$('[data-listen-answer]').find(b=>normalize(decodeURIComponent(b.dataset.listenAnswer))===normalize(correct))?.classList.add('correct');$('#listenFeedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><strong>${ok?'✓ Correto':'Quase'}</strong><br>${esc(correct)}</div>`;updateSkill('listening',ok?92:50);if(!ok)addError('listening','Compreensão auditiva',given,correct);touchStudy(ok?6:2,2);return;}
    const ra=e.target.closest('[data-reading-answer]');if(ra){const ok=Number(ra.dataset.readingAnswer)===Number(ra.dataset.readingCorrect);$$('[data-reading-answer]').forEach(b=>b.disabled=true);ra.classList.add(ok?'correct':'wrong');const s=DATA.stories.filter(x=>levelRank(x.level)<=Math.min(levelRank(state.level)+1,LEVELS.length-1))[currentStoryIndex%DATA.stories.filter(x=>levelRank(x.level)<=Math.min(levelRank(state.level)+1,LEVELS.length-1)).length];$('#readingFeedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><strong>${ok?'✓ Evidência encontrada':'Leia de novo e procure a evidência'}</strong><br>Resposta: ${esc(s.opts[s.a])}</div>`;state.readingHistory.push({date:todayKey(),level:s.level,ok});if(!ok)addError('reading',s.q,s.opts[Number(ra.dataset.readingAnswer)],s.opts[s.a]);updateSkill('reading',ok?90:50);touchStudy(ok?6:2,3);save();return;}
    const rev=e.target.closest('[data-review-grade]');if(rev){let pool=dueCards();if(!pool.length)pool=allVocab().filter(v=>state.srs[v.id]).slice(0,20);const v=pool[reviewCursor%pool.length];scheduleCard(v.id,rev.dataset.reviewGrade);reviewCursor++;updateSkill('vocabulary',rev.dataset.reviewGrade==='again'?45:rev.dataset.reviewGrade==='hard'?65:rev.dataset.reviewGrade==='good'?85:95);touchStudy(rev.dataset.reviewGrade==='again'?1:3,1);renderReview();return;}
    const er=e.target.closest('[data-retry-error]');if(er){const id=er.dataset.retryError,input=$(`#retry-${id}`),given=input?.value.trim()||'';if(!given){toast('Digite sua resposta antes de verificar.');return;}const r=retryError(id,given);if(!r)return;if(r.locked){toast('Esta recuperação já foi feita. A próxima está agendada para depois.');return;}const fb=$(`#retry-feedback-${id}`);if(fb)fb.innerHTML=`<div class="feedback ${r.ok?'good':'bad'}"><strong>${r.ok?'✓ Recuperado da memória':'Ainda não consolidou'}</strong><br>${r.ok?(r.resolved?'Erro dominado e encerrado.':'Acertou. Ele voltará em outro dia para confirmar retenção.'):`Similaridade: ${Math.round(r.sim*100)}%. Revise o modelo e tente novamente mais tarde.`}</div>`;touchStudy(r.ok?5:2,2);if(r.resolved)setTimeout(renderErrors,900);return;}
    const pr=e.target.closest('[data-pron]');if(pr){currentPronIndex=Number(pr.dataset.pron);renderPronunciation();return;}
    const sc=e.target.closest('[data-start-checkpoint]');if(sc){const level=sc.dataset.startCheckpoint;checkpointSession={level,questions:checkpointQuestions(level),i:0,correct:0};renderCheckpoint();return;}
    const sf=e.target.closest('[data-start-final]');if(sf){startFinalExam(sf.dataset.startFinal);return;}
    const fra=e.target.closest('[data-final-reading-answer]');if(fra&&finalExamSession?.stage==='reading'){const q=finalExamSession.reading[finalExamSession.ri],given=decodeURIComponent(fra.dataset.finalReadingAnswer);if(normalize(given)===normalize(q.answer))finalExamSession.rc++;else addError('final-reading',q.prompt,given,q.answer);finalExamSession.ri++;if(finalExamSession.ri>=finalExamSession.reading.length)finalExamSession.stage='speaking';renderFinalExam();return;}
    const ca=e.target.closest('[data-checkpoint-answer]');if(ca&&checkpointSession){const q=checkpointSession.questions[checkpointSession.i],given=decodeURIComponent(ca.dataset.checkpointAnswer);if(normalize(given)===normalize(q.answer))checkpointSession.correct++;else addError('checkpoint',q.prompt,given,q.answer);checkpointSession.i++;if(checkpointSession.i>=checkpointSession.questions.length)finishCheckpoint();else renderCheckpoint();return;}
    const actionBtn=e.target.closest('[data-action]');if(!actionBtn)return;const action=actionBtn.dataset.action;
    if(action==='lessonNext')lessonNext();
    else if(action==='beginFromZero'){captureSetup();state.level='A0';state.startLevel='A0';state.onboarded=true;save();closeModal();currentLevelTab='A0';renderHome();}
    else if(action==='beginPlacement'){captureSetup();runPlacement();}
    else if(action==='finishPlacementModal'){closeModal();toast(`Trilha iniciada em ${state.level}.`);renderHome();}
    else if(action==='checkTyped'){const {activities}=currentActivity(),act=activities[state.lessonStep],v=$('#typeAnswer')?.value.trim()||'',g=gradeActivity(act,v);showLessonFeedback(g.ok,act.answer,`Similaridade: ${Math.round(g.sim*100)}%`);}
    else if(action==='lessonSpeak'){const btn=$('#lessonMic'),{activities}=currentActivity(),act=activities[state.lessonStep];btn?.classList.add('listening');const cap=$('#liveLessonCaption');recognition(spoken=>{const g=gradeLessonOral(spoken,act,'voice');showLessonFeedback(g.ok,act.type==='transfer'?'':act.answer,g.extra,true);},()=>btn?.classList.remove('listening'),partial=>{if(cap){cap.textContent=partial;cap.classList.add('active');}});}
    else if(action==='lessonTypedSpeak'){if(speechSupported()){toast('Seu navegador suporta microfone. Use a fala nesta etapa.');return;}const {activities}=currentActivity(),act=activities[state.lessonStep],v=$('#oralFallback')?.value.trim()||'';if(!v){toast('Digite sua produção primeiro.');return;}const g=gradeLessonOral(v,act,'typed');showLessonFeedback(g.ok,act.type==='transfer'?'':act.answer,g.extra+' · modo texto, sem comprovação oral.',true);}
    else if(action==='skipSpeak'){toast('Nesta versão a fala não é pulada quando o microfone está disponível.');}
    else if(action==='nextFromModal'){closeModal();startLesson(nextLesson().id,true);}
    else if(action==='sendChat')sendChat();
    else if(action==='chatMic'){const btn=$('#chatMic'),cap=$('#liveCaption');btn.classList.add('listening');if(cap){cap.textContent='Ouvindo…';cap.classList.add('active');}recognition(spoken=>sendChat(spoken),()=>btn.classList.remove('listening'),partial=>{if(cap){cap.textContent=partial;cap.classList.add('active');}});}
    else if(action==='resetChat'){state.chatTurn=0;save();renderTalk();}
    else if(action==='pronSpeak'){const pool=pronunciationPool(),p=pool[currentPronIndex%pool.length],btn=$('#pronMic');btn.classList.add('listening');recognition(spoken=>gradePronunciation(spoken,p.text),()=>btn.classList.remove('listening'));}
    else if(action==='gameCheckBuilder'){if(!arcadeSession?.current)return;const built=(arcadeSession.selected||[]).join(' '),ok=normalize(built)===normalize(arcadeSession.current.en);$$('[data-builder-token]').forEach(b=>b.disabled=true);gradeGame(ok);}
    else if(action==='gameNext'){nextArcadeRound();}
    else if(action==='showTranscript'){const hist=scenarioHistory();openModal('<span class="mini-label">TRANSCRIÇÃO DA CONVERSA</span><h2>'+esc(currentScenario().title)+'</h2><div class="chat-body" style="max-height:55vh">'+(hist.length?hist.map(x=>'<div class="message '+(x.role==='user'?'user':'ai')+'"><small>'+ (x.role==='user'?'VOCÊ':'LIA') +'</small><br>'+interactiveWords(x.text)+'</div>').join(''):'<p>Nenhuma conversa salva neste cenário.</p>')+'</div><p>Toque em palavras para salvá-las na revisão.</p><div class="modal-actions"><button class="secondary" data-action="clearTranscript">Limpar cenário</button><button class="primary" data-close-modal>Fechar</button></div>');}
    else if(action==='clearTranscript'){if(confirm('Apagar a transcrição deste cenário?')){state.conversationHistory=(state.conversationHistory||[]).filter(x=>x.scenario!==state.scenario);save();closeModal();renderTalk();}}
    else if(action==='nextPron'){currentPronIndex=(currentPronIndex+1)%pronunciationPool().length;renderPronunciation();}
    else if(action==='shadowSpeak'){const pool=pronunciationPool(),p=pool[(state.shadowIndex||0)%pool.length],btn=$('#shadowMic');btn?.classList.add('listening');recognition(spoken=>gradeShadow(spoken,p.text),()=>btn?.classList.remove('listening'));}
    else if(action==='nextShadow'){state.shadowIndex=((state.shadowIndex||0)+1)%pronunciationPool().length;save();renderShadowing();}
    else if(action==='finalSpeak'){const btn=actionBtn;btn.classList.add('listening');recognition(spoken=>submitFinalSpeaking(spoken,'voice'),()=>btn.classList.remove('listening'));}
    else if(action==='finalTyped'){submitFinalSpeaking($('#finalAnswer')?.value||'','typed');}
    else if(action==='printCertificate'){window.print();}
    else if(action==='nextListening'){currentListeningIndex=(currentListeningIndex+1)%listeningPool().length;renderListening();}
    else if(action==='checkDictation'){const pool=dictationPool(),d=pool[currentDictationIndex%pool.length],v=$('#dictationAnswer')?.value||'',pct=Math.round(similarity(v,d.text)*100),ok=pct>=88;$('#dictationFeedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><strong>${ok?'✓ Muito bom':'Compare com atenção'}</strong><br>Modelo: ${esc(d.text)}<br>Similaridade: ${pct}%</div>`;state.dictationHistory.push({date:todayKey(),level:d.level,score:pct});if(!ok)addError('dictation','Ditado',v,d.text);updateSkill('listening',pct);updateSkill('writing',pct);touchStudy(ok?7:3,3);save();}
    else if(action==='nextDictation'){currentDictationIndex=(currentDictationIndex+1)%dictationPool().length;renderDictation();}
    else if(action==='nextStory'){currentStoryIndex=(currentStoryIndex+1)%DATA.stories.filter(x=>levelRank(x.level)<=Math.min(levelRank(state.level)+1,LEVELS.length-1)).length;renderReading();}
    else if(action==='checkWriting'){const pool=writingPool(),p=pool[currentWritingIndex%pool.length],t=$('#writingText')?.value||'';if(!t.trim()){toast('Escreva sua resposta primeiro.');return;}const a=writingAnalysis(t,p);state.writingHistory.push({date:todayKey(),level:p.level,score:a.score,text:t});updateSkill('writing',a.score);touchStudy(a.score>=75?10:5,6);$('#writingFeedback').innerHTML=`<div class="feedback ${a.score>=75?'good':'bad'}"><strong>Diagnóstico local: ${a.score}%</strong><br>${a.wc} palavras · ${a.sent} frase(s)${a.issues.length?`<ul>${a.issues.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<br>Não encontrei os erros comuns que este modo local sabe detectar.'}</div>`;save();}
    else if(action==='showWritingModel'){const p=writingPool()[currentWritingIndex%writingPool().length];openModal(`<small class="mini-label">MODELO DE REFERÊNCIA</small><h2>${esc(p.title)}</h2><p>${esc(p.model)}</p><p>Não precisa escrever igual. Compare organização, vocabulário e clareza.</p><div class="modal-actions"><button class="primary" data-close-modal>Fechar</button></div>`);}
    else if(action==='nextWriting'){currentWritingIndex=(currentWritingIndex+1)%writingPool().length;renderWriting();}
    else if(action==='revealReview'){let pool=dueCards();if(!pool.length)pool=allVocab().filter(v=>state.srs[v.id]).slice(0,20);const v=pool[reviewCursor%pool.length];$('#reviewReveal').innerHTML=`<strong>${esc(v.example)}</strong><br><span>${esc(v.pt)}</span>`;$('#reviewBtns').classList.remove('hidden');}
    else if(action==='showMoreVocab'){vocabLimit+=140;updateVocabList();}
    else if(action==='showMoreErrors'){errorLimit+=60;renderErrors();}
    else if(action==='placementTest')runPlacement();
    else if(action==='exportProgress')exportProgress();
    else if(action==='requestPersistence'){if(!navigator.storage?.persist){toast('Seu navegador não oferece esta opção.');}else navigator.storage.persist().then(ok=>toast(ok?'Armazenamento protegido pelo navegador.':'O navegador não concedeu persistência; mantenha backups periódicos.')).catch(()=>toast('Não foi possível solicitar persistência.'));}
    else if(action==='runDiagnostics')showDiagnostics();
    else if(action==='reloadApp')location.reload();
    else if(action==='resetProgress'){if(confirm('Apagar todo o progresso salvo neste navegador?')){localStorage.removeItem(STORAGE_KEY);state=clone(defaultState);save();route('home');setTimeout(placementIntro,250);}}
  });

  document.addEventListener('change',e=>{
    if(e.target.matches('[data-cando]')){state.canDoDone[e.target.dataset.cando]=e.target.checked;save();}
    if(e.target.id==='dailyGoal'){state.dailyGoal=Number(e.target.value);save();toast('Meta atualizada.');}
    if(e.target.id==='dailyMinutes'){state.dailyMinutes=Number(e.target.value);save();toast('Tempo diário atualizado.');}
    if(e.target.id==='voiceRate'){state.voiceRate=Number(e.target.value);$('#voiceRateLabel').textContent=`${state.voiceRate}x`;save();}
    if(e.target.id==='accent'){state.accent=e.target.value;save();toast('Voz atualizada.');}
    if(e.target.id==='autoSpeak'){state.autoSpeak=e.target.checked;save();}
    if(e.target.id==='reduceMotion'){state.accessibility.reduceMotion=e.target.checked;save();}
    if(e.target.id==='studyGoal'){state.goal=e.target.value;save();toast('Objetivo atualizado.');}
    if(e.target.id==='studentName'){state.name=e.target.value.trim().slice(0,40)||'Estudante';save();toast('Nome atualizado.');}
    if(e.target.id==='importFile')importProgress(e.target.files[0]);
  });
  document.addEventListener('input',e=>{
    if(e.target.id==='vocabSearch'){vocabQuery=normalize(e.target.value);vocabLimit=140;updateVocabList();}
  });
  document.addEventListener('click',e=>{
    const f=e.target.closest('[data-vocab-filter]');if(!f)return;vocabFilter=f.dataset.vocabFilter;vocabLimit=140;$$('[data-vocab-filter]').forEach(x=>x.classList.toggle('active',x===f));updateVocabList();
  });
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='chatText')sendChat();if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&e.target.id==='writingText')document.querySelector('[data-action="checkWriting"]')?.click();});

  function exportProgress(){state.lastBackup=new Date().toISOString();save();const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`fluentia-backup-${todayKey()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);}
  function importProgress(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);state=mergeState(obj);save();route('home');toast('Backup importado.');}catch{toast('Backup inválido.');}};r.readAsText(file);}
  function updateConnection(){const on=navigator.onLine;$('#connection').innerHTML=`<i style="background:${on?'var(--green)':'var(--red)'}"></i>${on?'Online':'Offline'}`;}

  $('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
  $('#themeBtn').addEventListener('click',()=>{state.theme=state.theme==='light'?'dark':'light';save();updateChrome();});
  $('#modalBackdrop').addEventListener('click',closeModal);
  window.addEventListener('popstate',()=>route((location.hash||'#home').slice(1),false));window.addEventListener('online',updateConnection);window.addEventListener('offline',updateConnection);
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('#installBtn').classList.remove('hidden');});
  $('#installBtn').addEventListener('click',async()=>{if(!deferredInstall){toast('Use a opção de instalar aplicativo do navegador.');return;}deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;$('#installBtn').classList.add('hidden');});
  if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.update().catch(()=>{});
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){toast('FluentIA atualizado. Aplicando a nova versão…');setTimeout(()=>w.postMessage?.({type:'SKIP_WAITING'}),350);}});});
    let refreshing=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(refreshing)return;refreshing=true;location.reload();});
  }).catch(err=>console.warn('FluentIA: service worker indisponível.',err)));
  window.addEventListener('error',e=>{console.error(e.error||e.message);showFatal('Ocorreu um erro inesperado. Seu progresso continua salvo; recarregue o aplicativo se alguma tela parar de responder.');});
  window.addEventListener('unhandledrejection',e=>{console.error(e.reason);showFatal('Uma operação falhou inesperadamente. Seu progresso local foi preservado; tente recarregar a tela.');});

  const bootCheck=courseIntegrity();if(!bootCheck.ok){console.error('FluentIA: falha de integridade do curso.',bootCheck.issues);showFatal('O conteúdo local não passou na verificação de integridade. Recarregue o aplicativo ou reinstale esta versão.');}
  ensureLiaCompanion();
  document.addEventListener('pointermove',e=>{document.querySelectorAll('[data-lia-avatar]').forEach(el=>{const r=el.getBoundingClientRect();if(!r.width)return;const x=Math.max(-3,Math.min(3,(e.clientX-(r.left+r.width/2))/Math.max(1,r.width)*7));const y=Math.max(-2,Math.min(2,(e.clientY-(r.top+r.height/2))/Math.max(1,r.height)*5));el.style.setProperty('--look-x',x.toFixed(2)+'px');el.style.setProperty('--look-y',y.toFixed(2)+'px');});},{passive:true});
  document.addEventListener('dblclick',e=>{const av=e.target.closest('[data-lia-avatar].hero');if(!av)return;setLiaMood('happy','Vamos praticar juntos!');speak('Hi '+(state.name||'there')+'! Let\'s practice English together.');});
  updateChrome();updateConnection();route((location.hash||`#${state.route||'home'}`).slice(1),false);if(!state.onboarded)setTimeout(placementIntro,350);
})();
